[workspace]
resolver = "3"
members = [
  "crates/blockdata",
  "crates/mcworld",
  "crates/atlascore",
  "crates/mcassets",
  "crates/mesher",
  "app/src-tauri",
]

[workspace.package]
edition = "2024"
version = "1.0.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
rayon = "1"
flate2 = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
codegen-units = 4
lto = "thin"
opt-level = 3
strip = true

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
